<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monopoly (3D preview)</title>
  <script>
    // 3D board preview, for before ui.js is switched over (docs: the renderer-switch integration).
    // Open /r3d/preview.html: it loads the real app (/index.html) with ui.js patched IN MEMORY the
    // way the integration steps describe — the board import points at renderer-switch.js, and
    // dialogs wait for busyUntil() — with 3D on for this page load. Everything else is the real app.
    // Reloading a game URL goes back to the normal page. Nothing on disk is changed.
    // Delete this file once ui.js imports './renderer-switch.js'.
    (async () => {
      try {
        const params = new URLSearchParams(location.search);
        if (!params.has('renderer')) params.set('renderer', '3d');
        history.replaceState(null, '', `${location.pathname}?${params}`);
        const get = async (path) => {
          const res = await fetch(path, { cache: 'no-cache' });
          if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
          return res.text();
        };
        const [html, ui] = await Promise.all([get('/index.html'), get('/ui.js')]);
        let head = '<base href="/">';
        let page = html;
        const importLine = "import { render as renderBoard } from './renderer2d.js';";
        const drawCall = /(\n[ \t]*)drawBoard\(events\);/;
        if (ui.includes(importLine) && drawCall.test(ui) && /<script type="module" src="\/ui\.js"><\/script>/.test(html)) {
          // The two integration edits, then absolute imports (a blob: module can't resolve './x.js').
          const patched = ui
            .replace(importLine, "import { render as renderBoard, busyUntil as boardBusyUntil } from './renderer-switch.js';")
            .replace(drawCall, '$1drawBoard(events);$1app.dialogAt = Math.max(app.dialogAt, boardBusyUntil());')
            .replace(/from '\.\/([\w.-]+)'/g, (m, file) => `from '${location.origin}/${file}'`);
          const url = URL.createObjectURL(new Blob([patched], { type: 'text/javascript' }));
          page = html.replace(/<script type="module" src="\/ui\.js"><\/script>/, `<script type="module" src="${url}"><\/script>`);
        } else {
          // ui.js changed shape: fall back to pointing its board import at the switch (no dialog timing).
          const map = {
            imports: { '/renderer2d.js': '/renderer-switch.js' },
            scopes: { '/renderer-switch.js': { '/renderer2d.js': '/renderer2d.js' } },
          };
          head += `<script type="importmap">${JSON.stringify(map)}<\/script>`;
          console.warn('[3d preview] ui.js did not match the expected shape; dialogs keep their 2D timing.');
        }
        document.open();
        document.write(page.replace(/<head([^>]*)>/i, (m) => m + head));
        document.close();
      } catch (err) {
        document.body.textContent = `Could not load the app: ${err}`;
      }
    })();
  </script>
</head>
<body></body>
</html>
